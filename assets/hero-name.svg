<svg xmlns="http://www.w3.org/2000/svg" width="820" height="200" viewBox="0 0 820 200" fill="none" role="img" aria-label="Prem Teja Gundabathina — Data Engineer">
  <defs>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="35%" stop-color="#06B6D4"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
      <animate attributeName="x1" values="0%;-100%;0%" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    .name { font: 800 52px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1.5px; }
    .role { font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 6px; }
    .focus { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 2px; }
  </style>
  <text x="410" y="78" text-anchor="middle" class="name" fill="url(#nameGrad)">PREM TEJA GUNDABATHINA</text>
  <text x="410" y="120" text-anchor="middle" class="role" fill="#C9D1D9">DATA ENGINEER</text>
  <text x="410" y="158" text-anchor="middle" class="focus" fill="#8B949E">Healthcare Data Platforms&#160;&#160;&#183;&#160;&#160;Cloud Data Engineering</text>
  <line x1="330" y1="178" x2="490" y2="178" stroke="url(#nameGrad)" stroke-width="2" stroke-linecap="round">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
  </line>
</svg>
