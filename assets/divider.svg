<svg xmlns="http://www.w3.org/2000/svg" width="820" height="12" viewBox="0 0 820 12" fill="none" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="25%" stop-color="#3B82F6" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="1"/>
      <stop offset="75%" stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <line x1="10" y1="6" x2="810" y2="6" stroke="url(#dl)" stroke-width="1.5" stroke-linecap="round">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="5s" repeatCount="indefinite"/>
  </line>
  <circle cy="6" r="5" fill="url(#dot)">
    <animate attributeName="cx" values="60;760;60" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" keyTimes="0;0.5;1"/>
  </circle>
</svg>
